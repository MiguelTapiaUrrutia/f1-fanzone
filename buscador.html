<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="F1 FanZone: buscador histórico de pilotos y escuderías de Fórmula 1 con datos de la API Jolpica.">
  <title>Buscador histórico — F1 FanZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav aria-label="Navegación principal">
      <a href="index.html" class="logo" aria-label="F1 FanZone, inicio">F1 FanZone</a>
      <button class="menu-boton" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu-principal">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul id="menu-principal">
        <li><a href="index.html#campeonato">Campeonato</a></li>
        <li><a href="index.html#calendario">Calendario</a></li>
        <li><a href="index.html#escuderias">Escuderías</a></li>
        <li><a href="index.html#historia">Historia</a></li>
        <li><a href="buscador.html" class="activo" aria-current="page">Buscador</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Buscador histórico</h1>

    <form id="form-buscador">
      <label for="termino">Piloto o escudería</label>
      <input type="text" id="termino" name="termino" required autocomplete="off">

      <fieldset>
        <legend>Tipo de búsqueda</legend>
        <input type="radio" id="tipo-piloto" name="tipo" value="piloto" checked>
        <label for="tipo-piloto">Buscar piloto</label>
        <input type="radio" id="tipo-escuderia" name="tipo" value="escuderia">
        <label for="tipo-escuderia">Buscar escudería</label>
      </fieldset>

      <button type="submit">Buscar</button>
    </form>

    <div id="estado" aria-live="polite"></div>
    <div id="resultado-principal"></div>
    <div id="resultado-relacionados"></div>
  </main>

  <footer>
    <p>Sitio fan no oficial. Sin afiliación con Formula 1, FIA ni equipos. &copy; 2026</p>
  </footer>

  <script src="js/app.js"></script>
  <script type="module" src="js/buscador.js"></script>
</body>
</html>
